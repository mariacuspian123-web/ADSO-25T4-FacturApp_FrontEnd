{% extends 'layout.html' %}

{% block content %}
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3">
          <h4 class="card-title mb-0">
            <i class="bi bi-person-plus me-2"></i>Register a new user
          </h4>
        </div>
        <div class="card-body p-4">
          <form action="/form_users" method="POST">
            <div class="row g-3">
              <!-- Nombre completo -->
              <div class="col-md-6">
                <label for="nombre" class="form-label fw-semibold">Full name</label>
                <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Ej. Carlos Martínez" required>
              </div>

              <!-- Correo electrónico -->
              <div class="col-md-6">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="usuario@correo.com" required>
              </div>

              <!-- Nombre de usuario / Login -->
              <div class="col-md-6">
                <label for="username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Ej. cmartinez" required>
              </div>

              <!-- Rol / Nivel de acceso -->
              <div class="col-md-6">
                <label for="rol" class="form-label fw-semibold">Role of the system</label>
                <select class="form-select" id="rol" name="rol" required>
                  <option value="" selected disabled>Select role</option>
                  <option value="Administrador">Administrator</option>
                  <option value="Operario">Operations Assistant / Cashier</option>
                  <option value="Supervisor">Supervisor</option>
                </select>
              </div>

              <!-- Contraseña -->
              <div class="col-md-6">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              </div>

              <!-- Confirmar contraseña -->
              <div class="col-md-6">
                <label for="confirm_password" class="form-label fw-semibold">Confirm password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
              </div>

              <!-- Estado -->
              <div class="col-12 mt-3">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" role="switch" id="estado_usuario" name="estado_usuario" checked>
                  <label class="form-check-label" for="estado_usuario">Active user with system access</label>
                </div>
              </div>
            </div>

            <!-- Botones -->
            <div class="d-flex justify-content-end gap-2 mt-4">
              <a href="/list_users" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-dark px-4">Create user</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
